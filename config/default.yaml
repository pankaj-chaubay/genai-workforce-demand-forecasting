# Pipeline settings. Every number here is an assumption for the synthetic case.
# Change them to match your own organisation before using the outputs.

seed: 42

data:
  start: "2022-01"          # 2020-2021 left out on purpose: COVID years distort hiring patterns
  end: "2025-06"
  technologies: [solar, wind]
  countries: [DE, ES]
  role_families: [engineer, technician, project_manager, admin]

privacy:
  min_cell_size: 10         # groups smaller than this are suppressed in audit tables
  retention_months: 48      # employee-level records older than this are dropped before modelling
  pseudonym_salt_env: WF_PSEUDONYM_SALT   # read from the environment; a fixed dev salt is used if unset

backtest:
  origins: ["2024-01", "2024-04", "2024-07"]   # last training month is the month before each origin
  horizon: 12
  horizon_buckets: {"1-3": [1, 3], "4-6": [4, 6], "7-12": [7, 12]}

forecast:
  origin: "2025-07"         # first month of the forward forecast
  horizon: 12
  interval: 0.8             # central prediction interval from the Poisson count distribution

fairness:
  max_abs_bias_pct: 5.0     # flag a role family when mean signed error is above this
  diversity_targets:        # target share of women among new hires, per role family
    engineer: 0.30
    technician: 0.20
    project_manager: 0.40
    admin: 0.50

cost:                       # assumptions for the cost-impact estimate (EUR)
  cost_per_hire: 4000
  urgent_hire_premium: 1500 # extra cost of each role that has to be filled at short notice
  overhire_cost: 2500       # cost of each role hired but not needed in that quarter

recruiting_capacity:        # hires the recruiting team can handle per quarter, per role family
  engineer: 30
  technician: 60
  project_manager: 12
  admin: 25
